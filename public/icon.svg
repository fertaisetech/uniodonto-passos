<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="uniodonto-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CD176D" />
      <stop offset="100%" stop-color="#7e003c" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Outer rounded corner square -->
  <rect width="440" height="440" x="36" y="36" rx="96" fill="url(#uniodonto-grad)" filter="url(#subtle-shadow)" />
  
  <!-- Abstract premium tooth/heart medical integration curve -->
  <path d="M256,140 C295,140 345,175 345,245 C345,315 272,365 256,380 C240,365 167,315 167,245 C167,175 217,140 256,140 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Subtle inner glowing tech core -->
  <path d="M256,185 C278,185 305,208 305,245 C305,285 256,325 256,325 C256,325 207,285 207,245 C207,208 234,185 256,185 Z" 
        fill="#ffffff" 
        opacity="0.22" />
        
  <!-- Brilliant white sparkle dot indicating premium medical grade -->
  <circle cx="340" cy="175" r="14" fill="#ffffff" />
</svg>
